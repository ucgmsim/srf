name: Publish to PyPI
run-name: Publish Python Package to PyPI for release ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to checkout and publish"
        required: false
        type: string

jobs:
  build:
    # v2.3, not v2: the v2 tag predates build-dist.yml.
    uses: ucgmsim/meta-ci-action/.github/workflows/build-dist.yml@v2.3
    with:
      ref: ${{ inputs.tag_name }}

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ucgmsim-srf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.13.0
