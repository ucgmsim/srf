StylesPath = .vale

# Pinned to a release tag rather than named. A bare name resolves through the
# Vale package registry to `releases/latest/download`, so `vale sync` fetches
# whatever the package is on the day the job runs, and CI turns red on a commit
# that changed nothing. ai-tells alone shipped `ConsequenceClause`,
# `ConsequenceParticiple` and `FigurativeWorth` between two pushes to this
# branch. Vale derives the style name from the zip filename, so the names under
# `BasedOnStyles` are unchanged.
#
# Bump these on purpose: check the releases pages, raise the tag, run
# `vale sync`, and fix the prose the new rules find in its own commit.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

Vocab = srf

[*.md]
BasedOnStyles = Vale, ai-tells, proselint, Google, ucgmsim

[*.{py,pyi,rs}]
BasedOnStyles = ai-tells, proselint, Google, ucgmsim

# ---------------------------------------------------------------------------
# Vale has no reStructuredText or numpydoc parser, and no way to scope a rule
# inside a source file: TokenIgnores, BlockIgnores and `vale off` comments all
# apply to markup formats only. So numpydoc section underlines, `name : type`
# parameter lines, array shapes, doctest blocks and inline literals reach
# these rules as ordinary prose, and switching the rule off for Python is the
# only lever available.
# ---------------------------------------------------------------------------

# Section underlines ("Parameters\n----------") and `# ---` comment banners.
# `ucgmsim.DoubleHyphen` takes the spaced form this leaves behind, which is
# the one that is always punctuation.
ai-tells.DoubleHyphen = NO
# The `name : type` parameter lines every numpydoc docstring is made of.
ai-tells.ColonUsage = NO
# Array shapes `(n_points,)`, call signatures and the units that qualify
# almost every column: "slip rate (cm/s)".
Google.Parens = NO
# A dotted name reads as a missing space after a period: "'d.D' should have
# one space" for `np.float32`.
Google.Spacing = NO
# The format's names are the vocabulary here: SRF, CGS, CSR, EMOD3D. The rule
# wants each spelled out in the file that uses it, which per-module reference
# docs cannot do.
Google.Acronyms = NO
# Elided arguments in prose and doctests, `apply_ufunc(..., dask=...)`.
Google.Ellipses = NO
proselint.Typography = NO
# Punctuation next to a backticked identifier, as in `dataset.attrs["name"]`.
Google.Quotes = NO
# TODO, FIXME and NOTE are code annotations, not prose left unfinished.
proselint.Annotations = NO

# ---------------------------------------------------------------------------
# Domain vocabulary that general-prose rules read as figure of speech.
# ---------------------------------------------------------------------------

# "shape" is the array dimension tuple, which the rule's own guidance names as
# an exemption.
ai-tells.FigurativeShape = NO
