[project]
name = "ucgmsim-srf"
version = "0.1.0"
description = "Read and write Standard Rupture Format (SRF) files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ucgmsim" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
test = ["hypothesis>=6.151.0", "pytest>=8", "pytest-cov>=5"]

[dependency-groups]
dev = ["deptry", "ruff", "ty"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "srf._core"
python-packages = ["srf"]
python-source = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
]

[tool.deptry]
known_first_party = ["srf"]
optional_dependencies_dev_groups = ["test"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001",
  # pathlib rather than os and os.path
  "PTH",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["srf"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["D", "ANN001"]

[tool.npdlint]
include = ["src/srf"]
select = ["ALL"]
ignore = ["ES01", "SA01", "EX01"]

# Properties read as attributes, so document them as "type: summary".
[[tool.npdlint.scope]]
match = { kind = "property" }
extend-ignore = ["PR", "RT", "ES01"]
extend-select = ["PT"]
property-form = "type-line"

# Dunder methods only need to exist.
[[tool.npdlint.scope]]
match = { kind = "any-method", dunder = true }
select = ["GL08"]

# Last, so no block above re-selects a rule for them: private helpers are not
# part of the public API and need no docstring.
[[tool.npdlint.scope]]
match = { private = true }
skip = true

[[tool.npdlint.scope]]
match = { nested = true }
skip = true
