[package]
name = "srf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reading and writing the Standard Rupture Format, as a Python extension."
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
lexical-core = "1.0.6"
nom = "8"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
thiserror = "2"

[lints.clippy]
# Clippy at zero is a gate, not an aspiration. Lints are `warn`, never `deny`; a
# suppression is a targeted #[allow] with the reason written beside it. CI runs
# clippy with -D warnings.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
